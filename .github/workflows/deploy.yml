# Deploy (task 0.5, ADR-0003, ARCHITECTURE §18).
#
# staging:    runs when CI has passed on `main` (a red CI never deploys). Builds the Worker with
#             OpenNext, then pushes migrations to the staging Supabase project, then deploys.
# production: runs on a `v*` tag, but only for a commit that is on `main` and whose CI run passed
#             all three required checks (CI does not run on tags, so the job reads the commit's
#             check runs). Until the `production` GitHub environment is filled in, a tag push
#             fails at the build or migration step with the missing name in the log; nothing is
#             deployed. Both jobs end with `scripts/smoke-deploy.sh` against the deployed
#             address (3c.1): health route, security headers on a proxy redirect, and on
#             production the workers.dev → app.maxoff.in redirect.
#
# Every value comes from the GitHub *environment* of the same name (Settings → Environments).
# Secrets and variables are listed in README → "Deploying". Secrets are given only to the step
# that needs them, never to the whole job.
name: Deploy

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  staging:
    name: staging
    if: github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    concurrency:
      group: deploy-staging
      cancel-in-progress: false
    environment:
      name: staging
      url: ${{ vars.NEXT_PUBLIC_APP_URL }}
    env:
      # Inlined by `next build`; none of these are secret.
      NEXT_PUBLIC_APP_ENV: staging
      NEXT_PUBLIC_APP_URL: ${{ vars.NEXT_PUBLIC_APP_URL }}
      NEXT_PUBLIC_SUPABASE_URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ vars.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
      NEXT_PUBLIC_SENTRY_DSN: ${{ vars.NEXT_PUBLIC_SENTRY_DSN }}
    steps:
      - uses: actions/checkout@v4
        with:
          # The commit CI just verified, not whatever `main` points at now.
          ref: ${{ github.event.workflow_run.head_sha }}
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # Build before touching the database: a failed build must never leave the schema ahead
      # of the Worker that is still serving.
      - name: Build the Worker (OpenNext)
        env:
          # Source-map upload only; absent locally and in CI.
          SENTRY_ORG: ${{ vars.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ vars.SENTRY_PROJECT }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
        run: pnpm build:worker

      # Staging is shared with the phase branches (preview.yml applies a `phase-*` branch's
      # migrations to it on every push), so mid-phase staging is usually *ahead* of `main` and a
      # blind `db push` refuses. The script lists first and pushes only what main adds; when
      # main adds a migration while staging is ahead it fails loudly naming both sets (owner
      # decision 2026-09-27; the script's header has the decision table and the dry run).
      - name: Apply migrations to the staging database
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
        run: bash scripts/staging-migrations.sh

      # The Worker secrets travel with the code, in the same version (`wrangler deploy
      # --secrets-file`, additive: a secret left out of the file keeps its current value).
      # They used to go up first through `wrangler secret bulk`, which Cloudflare refuses with
      # error 10215 whenever the Worker's newest version is not the deployed one — and since the
      # branch previews (task 2.0) every push uploads an undeployed version of the staging
      # Worker, so the first deploy after phase 2 failed exactly there (2026-09-27). The file
      # lives only for the deploy step and is removed even when that step fails.
      - name: Write the Worker secrets file
        run: |
          set -euo pipefail
          if [ -z "$SUPABASE_SECRET_KEY" ]; then
            echo '::error::SUPABASE_SECRET_KEY is not set in this environment (README → Secrets); the app cannot invite without it.'
            exit 1
          fi
          # Optional ones are included only when set: without SESSION_IP_HASH_SALT
          # session_events.ip_hash stays null, which never fails the deploy. (DAY_GATE_COOKIE_SECRET
          # went with the 2.x day gate: the 3c.1 contract migration.) The R2 set (task 3.3: S3_*
          # from the environment's R2 token, bucket and account) and CRON_SECRET are optional the
          # same way: without them a deployed app refuses uploads with "File storage is not
          # configured" and the cron route answers 401 (reported once to Sentry). Email (5.2:
          # RESEND_API_KEY + EMAIL_FROM, both or neither) and Web Push (5.2: VAPID_PUBLIC_KEY,
          # VAPID_PRIVATE_KEY, VAPID_SUBJECT, all three or none) are optional the same way: without
          # them nothing is emailed or pushed, and the in-app notifications still work. They are read
          # at runtime, never inlined by the build; the server hands the public key to the browser.
          umask 077
          jq -n \
            --arg supabase "$SUPABASE_SECRET_KEY" \
            --arg salt "$SESSION_IP_HASH_SALT" \
            --arg s3_endpoint "https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com" \
            --arg s3_bucket "$R2_BUCKET" \
            --arg s3_key "$R2_ACCESS_KEY_ID" \
            --arg s3_secret "$R2_SECRET_ACCESS_KEY" \
            --arg cron "$CRON_SECRET" \
            --arg resend "$RESEND_API_KEY" \
            --arg email_from "$EMAIL_FROM" \
            --arg vapid_public "$VAPID_PUBLIC_KEY" \
            --arg vapid_private "$VAPID_PRIVATE_KEY" \
            --arg vapid_subject "$VAPID_SUBJECT" \
            '{SUPABASE_SECRET_KEY: $supabase}
             + (if $salt == "" then {} else {SESSION_IP_HASH_SALT: $salt} end)
             + (if $s3_key == "" or $s3_secret == "" or $s3_bucket == "" then {}
                else {S3_ENDPOINT: $s3_endpoint, S3_BUCKET: $s3_bucket, S3_ACCESS_KEY_ID: $s3_key,
                      S3_SECRET_ACCESS_KEY: $s3_secret, S3_REGION: "auto"} end)
             + (if $cron == "" then {} else {CRON_SECRET: $cron} end)
             + (if $resend == "" or $email_from == "" then {}
                else {RESEND_API_KEY: $resend, EMAIL_FROM: $email_from} end)
             + (if $vapid_public == "" or $vapid_private == "" or $vapid_subject == "" then {}
                else {VAPID_PUBLIC_KEY: $vapid_public, VAPID_PRIVATE_KEY: $vapid_private,
                      VAPID_SUBJECT: $vapid_subject} end)' \
            >.wrangler-secrets.json
          jq -r 'keys | "Secrets in this deployment: " + join(", ")' .wrangler-secrets.json
        env:
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          SESSION_IP_HASH_SALT: ${{ secrets.SESSION_IP_HASH_SALT }}
          R2_ACCOUNT_ID: ${{ vars.R2_ACCOUNT_ID }}
          R2_BUCKET: ${{ vars.R2_BUCKET }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          EMAIL_FROM: ${{ vars.EMAIL_FROM }}
          VAPID_PUBLIC_KEY: ${{ vars.VAPID_PUBLIC_KEY }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          VAPID_SUBJECT: ${{ vars.VAPID_SUBJECT }}

      - name: Deploy to Cloudflare Workers
        id: deploy
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          environment: staging
          command: deploy --env staging --secrets-file .wrangler-secrets.json

      - name: Remove the Worker secrets file
        if: always()
        run: rm -f .wrangler-secrets.json

      # What the Worker really answers (3c.1): the health route reaches the database, and a
      # redirect the proxy answers itself carries the security headers (they are set in
      # `updateSession()`, because `next.config.ts`'s rule does not reach a proxy redirect on the
      # Worker). Runs against the deployed address, never `next start`.
      - name: Smoke-check the deployed Worker
        env:
          APP_URL: ${{ vars.NEXT_PUBLIC_APP_URL }}
        run: bash scripts/smoke-deploy.sh "$APP_URL"

  production:
    name: production
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    environment:
      name: production
      url: ${{ vars.NEXT_PUBLIC_APP_URL }}
    permissions:
      contents: read
      # Reading the tagged commit's CI check runs (the gate below).
      checks: read
    env:
      NEXT_PUBLIC_APP_ENV: production
      NEXT_PUBLIC_APP_URL: ${{ vars.NEXT_PUBLIC_APP_URL }}
      NEXT_PUBLIC_SUPABASE_URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ vars.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
      NEXT_PUBLIC_SENTRY_DSN: ${{ vars.NEXT_PUBLIC_SENTRY_DSN }}
    steps:
      - uses: actions/checkout@v4

      # CI does not run on tags, so a tag alone proves nothing. Production only takes a commit
      # that is on `main` (protected: PR + the three required checks) AND whose own CI run
      # passed all three checks. Anything else stops here, before any secret is touched.
      # If CI is still running on that commit, wait for it and re-run this workflow run.
      - name: Require the tagged commit to be on main with green CI
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sha="$(git rev-parse 'HEAD^{commit}')"
          git fetch --no-tags --depth=1000 origin main
          if ! git merge-base --is-ancestor "$sha" origin/main; then
            echo "::error::$GITHUB_REF_NAME points at $sha, which is not on main. Tag a commit on main."
            exit 1
          fi
          failed=0
          for check in "typecheck · lint · format · unit · build" "pgTAP" "playwright"; do
            conclusion="$(gh api -X GET "repos/$GITHUB_REPOSITORY/commits/$sha/check-runs" \
              -f check_name="$check" -f filter=latest \
              --jq 'if (.check_runs | length) == 0 then "missing" else .check_runs[0].conclusion // "in_progress" end')"
            echo "$check: $conclusion"
            [ "$conclusion" = "success" ] || failed=1
          done
          if [ "$failed" = 1 ]; then
            echo "::error::CI is not green on $sha. Every required check must be 'success' before a production deploy."
            exit 1
          fi

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Build the Worker (OpenNext)
        env:
          SENTRY_ORG: ${{ vars.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ vars.SENTRY_PROJECT }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
        run: pnpm build:worker

      - name: Apply migrations to the production database
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
        run: |
          pnpm supabase link --project-ref "$SUPABASE_PROJECT_REF"
          pnpm supabase db push

      # The Worker secrets travel with the code, in the same version (`wrangler deploy
      # --secrets-file`, additive: a secret left out of the file keeps its current value).
      # They used to go up first through `wrangler secret bulk`, which Cloudflare refuses with
      # error 10215 whenever the Worker's newest version is not the deployed one — and since the
      # branch previews (task 2.0) every push uploads an undeployed version of the staging
      # Worker, so the first deploy after phase 2 failed exactly there (2026-09-27). The file
      # lives only for the deploy step and is removed even when that step fails.
      - name: Write the Worker secrets file
        run: |
          set -euo pipefail
          if [ -z "$SUPABASE_SECRET_KEY" ]; then
            echo '::error::SUPABASE_SECRET_KEY is not set in this environment (README → Secrets); the app cannot invite without it.'
            exit 1
          fi
          # Optional ones are included only when set: without SESSION_IP_HASH_SALT
          # session_events.ip_hash stays null, which never fails the deploy. (DAY_GATE_COOKIE_SECRET
          # went with the 2.x day gate: the 3c.1 contract migration.) The R2 set (task 3.3: S3_*
          # from the environment's R2 token, bucket and account) and CRON_SECRET are optional the
          # same way: without them a deployed app refuses uploads with "File storage is not
          # configured" and the cron route answers 401 (reported once to Sentry). Email (5.2:
          # RESEND_API_KEY + EMAIL_FROM, both or neither) and Web Push (5.2: VAPID_PUBLIC_KEY,
          # VAPID_PRIVATE_KEY, VAPID_SUBJECT, all three or none) are optional the same way: without
          # them nothing is emailed or pushed, and the in-app notifications still work. They are read
          # at runtime, never inlined by the build; the server hands the public key to the browser.
          umask 077
          jq -n \
            --arg supabase "$SUPABASE_SECRET_KEY" \
            --arg salt "$SESSION_IP_HASH_SALT" \
            --arg s3_endpoint "https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com" \
            --arg s3_bucket "$R2_BUCKET" \
            --arg s3_key "$R2_ACCESS_KEY_ID" \
            --arg s3_secret "$R2_SECRET_ACCESS_KEY" \
            --arg cron "$CRON_SECRET" \
            --arg resend "$RESEND_API_KEY" \
            --arg email_from "$EMAIL_FROM" \
            --arg vapid_public "$VAPID_PUBLIC_KEY" \
            --arg vapid_private "$VAPID_PRIVATE_KEY" \
            --arg vapid_subject "$VAPID_SUBJECT" \
            '{SUPABASE_SECRET_KEY: $supabase}
             + (if $salt == "" then {} else {SESSION_IP_HASH_SALT: $salt} end)
             + (if $s3_key == "" or $s3_secret == "" or $s3_bucket == "" then {}
                else {S3_ENDPOINT: $s3_endpoint, S3_BUCKET: $s3_bucket, S3_ACCESS_KEY_ID: $s3_key,
                      S3_SECRET_ACCESS_KEY: $s3_secret, S3_REGION: "auto"} end)
             + (if $cron == "" then {} else {CRON_SECRET: $cron} end)
             + (if $resend == "" or $email_from == "" then {}
                else {RESEND_API_KEY: $resend, EMAIL_FROM: $email_from} end)
             + (if $vapid_public == "" or $vapid_private == "" or $vapid_subject == "" then {}
                else {VAPID_PUBLIC_KEY: $vapid_public, VAPID_PRIVATE_KEY: $vapid_private,
                      VAPID_SUBJECT: $vapid_subject} end)' \
            >.wrangler-secrets.json
          jq -r 'keys | "Secrets in this deployment: " + join(", ")' .wrangler-secrets.json
        env:
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          SESSION_IP_HASH_SALT: ${{ secrets.SESSION_IP_HASH_SALT }}
          R2_ACCOUNT_ID: ${{ vars.R2_ACCOUNT_ID }}
          R2_BUCKET: ${{ vars.R2_BUCKET }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          EMAIL_FROM: ${{ vars.EMAIL_FROM }}
          VAPID_PUBLIC_KEY: ${{ vars.VAPID_PUBLIC_KEY }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          VAPID_SUBJECT: ${{ vars.VAPID_SUBJECT }}

      - name: Deploy to Cloudflare Workers
        id: deploy
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          environment: production
          command: deploy --env production --secrets-file .wrangler-secrets.json

      - name: Remove the Worker secrets file
        if: always()
        run: rm -f .wrangler-secrets.json

      # As on staging, plus the workers.dev address must send visitors to the custom domain.
      - name: Smoke-check the deployed Worker
        env:
          APP_URL: ${{ vars.NEXT_PUBLIC_APP_URL }}
        run: bash scripts/smoke-deploy.sh "$APP_URL" https://maxoff.pixoraclips.workers.dev
