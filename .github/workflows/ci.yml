# CI (task 0.4). Red never merges: enable branch protection on `main` requiring these three
# checks (README → "Branch protection").
name: CI

on:
  push:
    branches: [main, "phase-*"]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CI: true
  # Placeholders so `core/db` env checks pass at build time. Nothing in CI reaches a database
  # through them; pgTAP talks to the local stack the `db` job starts.
  NEXT_PUBLIC_APP_URL: http://localhost:3000
  NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
  NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ci-placeholder

jobs:
  check:
    name: typecheck · lint · format · unit · build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm test
      # The OpenNext build runs `next build` and then bundles the Worker, so a change the
      # Workers runtime can't take fails here, before merge (task 0.5).
      - run: pnpm build:worker

  db:
    name: pgTAP
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Only Postgres is needed for pgTAP; skipping the other services keeps the job short.
      - run: pnpm supabase start -x gotrue,realtime,storage-api,imgproxy,kong,mailpit,postgrest,postgres-meta,studio,edge-runtime,logflare,vector,supavisor
      - run: pnpm db:test
      - if: always()
        run: pnpm supabase stop --no-backup

  e2e:
    name: playwright
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      # Every Playwright project runs against `next start` of this build (task 1.2), signing
      # in as the seeded local users, so the local Supabase stack (Auth, PostgREST, Kong,
      # Mailpit for the recovery email) must be up before the build inlines its keys.
      - run: pnpm supabase start -x realtime,storage-api,imgproxy,postgres-meta,studio,edge-runtime,logflare,vector,supavisor
      - name: Point the build at the local stack
        run: |
          pnpm exec supabase status -o env | grep -E '^(API_URL|PUBLISHABLE_KEY)=' > supabase-status.env
          echo "NEXT_PUBLIC_SUPABASE_URL=$(grep '^API_URL=' supabase-status.env | cut -d= -f2- | tr -d '"')" >> "$GITHUB_ENV"
          echo "NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY=$(grep '^PUBLISHABLE_KEY=' supabase-status.env | cut -d= -f2- | tr -d '"')" >> "$GITHUB_ENV"
      - run: pnpm build
      - run: pnpm test:e2e
      - if: always()
        run: pnpm supabase stop --no-backup
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7
