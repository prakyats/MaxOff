# CI (task 0.4). Red never merges: enable branch protection on `main` requiring these three
# checks (README → "Branch protection").
#
# What runs when (owner decision 2026-09-27, ARCHITECTURE §18 "CI"; speed, not minutes: the repo
# is public):
#   * every code push (main, phase-*): typecheck, lint, format, unit, build, budget, and pgTAP;
#   * Playwright only where a full run is the gate: pull requests (to main), pushes to main (so
#     Deploy, which waits for this workflow on main, always follows a full e2e run), and a manual
#     dispatch with "full tests" on (`/run-phase` dispatches it on the phase branch after each
#     unit's last push and waits for it, so CI stays the authority per unit);
#   * a docs-only push runs nothing (`paths-ignore`). A pull request has no path filter at the
#     trigger, because the three checks are required on `main` and a workflow that never starts
#     leaves them pending forever; its jobs skip instead (the `changes` job), and a skipped
#     required job counts as passed.
name: CI

on:
  push:
    branches: [main, "phase-*"]
    paths-ignore:
      - "docs/**"
      - "**/*.md"
      - "screenshots/**"
  pull_request:
  workflow_dispatch:
    inputs:
      full:
        description: "Full tests: run Playwright too"
        type: boolean
        default: true

# One run per branch and trigger: a newer push cancels the older run on the same branch, and a
# push never cancels a dispatched full run (or the reverse). On main a cancelled run never
# deploys; the newer one, which carries its changes, does.
concurrency:
  group: ci-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CI: true
  # Placeholders so `core/db` env checks pass at build time. Nothing in CI reaches a database
  # through them; pgTAP talks to the local stack the `db` job starts.
  NEXT_PUBLIC_APP_URL: http://localhost:3000
  NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
  NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ci-placeholder

jobs:
  # Pull requests only: does the change touch anything but docs? (A push is filtered at the
  # trigger instead.) Plain git, no third-party action.
  changes:
    name: changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      code: ${{ steps.diff.outputs.code }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: diff
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "code=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          files=$(git diff --name-only "$BASE...$HEAD")
          echo "$files"
          if echo "$files" | grep -vqE '^(docs/|screenshots/)|\.md$'; then
            echo "code=true" >> "$GITHUB_OUTPUT"
          else
            echo "code=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Docs-only pull request: the checks skip (a skipped required check passes)."
          fi

  check:
    name: typecheck · lint · format · unit · build
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm test
      # The OpenNext build runs `next build` and then bundles the Worker, so a change the
      # Workers runtime can't take fails here, before merge (task 0.5).
      - run: pnpm build:worker
      # First-load JS per route against bundle-budget.json (task 2.8): /login went to 1.34 MB in
      # phase 1 without anyone noticing. Reads the manifests `next build` just wrote.
      - run: pnpm budget

  db:
    name: pgTAP
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Only Postgres is needed for pgTAP; skipping the other services keeps the job short.
      - run: pnpm supabase start -x gotrue,realtime,storage-api,imgproxy,kong,mailpit,postgrest,postgres-meta,studio,edge-runtime,logflare,vector,supavisor
      - run: pnpm db:test
      - if: always()
        run: pnpm supabase stop --no-backup
      - if: always()
        run: pnpm storage:stop

  # Playwright in two shards on two runners (owner decision 2026-09-28, after phase 3b: one runner
  # took 18 of its 20 minutes). Each shard builds and starts its own stack, so the shards share
  # nothing. `owner-bulk` depends on desktop, mobile and mobile-lg (its "Approve all" must run
  # alone, after every project that creates rows), and a dependency chain is never split, so
  # sharding it with the rest put ~98% of the suite in shard 1. The shards therefore run every
  # project but it, and shard 2 runs it afterwards with `--no-deps`, alone, on its own database.
  # The required check is the `playwright` job below, not these.
  e2e:
    name: playwright (shard ${{ matrix.shard }}/2)
    needs: changes
    # The full run: pull requests, pushes to main (before Deploy), and a dispatch with "full
    # tests" on. A push to a phase branch skips it; /run-phase dispatches it once per unit. A
    # dispatch on main always runs it: Deploy follows any green CI run on main, so none may skip it.
    if: >-
      needs.changes.outputs.code == 'true' && (
        github.event_name == 'pull_request' ||
        (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
        (github.event_name == 'workflow_dispatch' && (inputs.full || github.ref == 'refs/heads/main'))
      )
    runs-on: ubuntu-latest
    # The run itself takes 11-15 min; the rest is room for the midnight-IST wait below (at most
    # 32 min, only for a run that would start between 23:29 and 00:01 IST).
    timeout-minutes: 65
    strategy:
      # Both shards always finish, so one red run shows every failure.
      fail-fast: false
      matrix:
        shard: [1, 2]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      # Every Playwright project runs against `next start` of this build (task 1.2), signing
      # in as the seeded local users, so the local Supabase stack (Auth, PostgREST, Kong,
      # Mailpit for the recovery email) must be up before the build inlines its keys.
      # One business day per run (ARCHITECTURE §15): a run that could still be going at 23:59 IST
      # waits until 00:01 IST first, before the database exists, so the server, Postgres and the
      # attendance jobs all agree on "today" from the first spec to the last.
      - run: node scripts/wait-for-ist-day.mjs
      # Realtime runs too (5A build decision 23): the live bell, proved through the hold proxy by
      # e2e/notifications.spec.ts; global setup waits for a channel to join.
      - run: pnpm supabase start -x storage-api,imgproxy,postgres-meta,studio,edge-runtime,logflare,vector,supavisor
      # File storage (3.3): the same MinIO the developer runs, so uploads and the cleanup route
      # are exercised end to end offline. Its throwaway values are playwright.config.ts's defaults.
      - run: pnpm storage:start
      - name: Point the build at the local stack
        run: |
          pnpm exec supabase status -o env | grep -E '^(API_URL|PUBLISHABLE_KEY|SECRET_KEY)=' > supabase-status.env
          echo "NEXT_PUBLIC_SUPABASE_URL=$(grep '^API_URL=' supabase-status.env | cut -d= -f2- | tr -d '"')" >> "$GITHUB_ENV"
          echo "NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY=$(grep '^PUBLISHABLE_KEY=' supabase-status.env | cut -d= -f2- | tr -d '"')" >> "$GITHUB_ENV"
          # The local stack's secret key (a throwaway, printed by `supabase status`): the team
          # flow (1.3) creates sign-ins through the Auth admin API, which `next start` needs at
          # runtime. Never a real project's key.
          echo "SUPABASE_SECRET_KEY=$(grep '^SECRET_KEY=' supabase-status.env | cut -d= -f2- | tr -d '"')" >> "$GITHUB_ENV"
      # The e2e server reaches Supabase through the hold proxy (4C review M1, e2e/hold-proxy.ts,
      # started by playwright.config.ts on the port in e2e/hold-proxy-config.ts), so the build
      # inlines the proxy's URL; the tests themselves keep the stack's own URL.
      - run: NEXT_PUBLIC_SUPABASE_URL=http://127.0.0.1:54331 pnpm build
      # A blob report per shard (the `playwright` job merges them into one HTML report); the
      # github reporter keeps failures annotated on the run.
      - run: >-
          pnpm test:e2e --shard=${{ matrix.shard }}/2 --reporter=github,blob
          e2e/session-expiry.spec.ts e2e/launch.spec.ts
          --project=setup --project=desktop --project=mobile --project=mobile-lg
      - name: Approve all (owner-bulk), alone, after the rest of shard 2
        if: false
        env:
          PLAYWRIGHT_BLOB_OUTPUT_DIR: blob-report-bulk
        run: |
          pnpm test:e2e --project=owner-bulk --no-deps --reporter=github,blob
          mv blob-report-bulk/*.zip blob-report/report-owner-bulk.zip
      # The cron dispatch (owner decision 29): serial, owning the queue, after owner-bulk.
      - name: Push and email dispatch (push-cron), alone, after owner-bulk
        if: false
        env:
          PLAYWRIGHT_BLOB_OUTPUT_DIR: blob-report-push-cron
        run: |
          pnpm test:e2e --project=push-cron --no-deps --reporter=github,blob
          mv blob-report-push-cron/*.zip blob-report/report-push-cron.zip
      - if: always()
        run: pnpm supabase stop --no-backup
      - if: always()
        run: pnpm storage:stop
      - if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: blob-report-${{ matrix.shard }}
          path: blob-report
          retention-days: 7

  # The required check keeps its name: green only when both shards passed (or the e2e run was
  # skipped by the rules above, which a required check counts as passed anyway). It also merges
  # the shards' blob reports into the one HTML report, `playwright-report`.
  playwright:
    name: playwright
    needs: [changes, e2e]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - if: needs.e2e.result == 'success' || needs.e2e.result == 'failure'
        uses: actions/checkout@v4
      - if: needs.e2e.result == 'success' || needs.e2e.result == 'failure'
        uses: pnpm/action-setup@v4
      - if: needs.e2e.result == 'success' || needs.e2e.result == 'failure'
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - if: needs.e2e.result == 'success' || needs.e2e.result == 'failure'
        run: pnpm install --frozen-lockfile
      - if: needs.e2e.result == 'success' || needs.e2e.result == 'failure'
        uses: actions/download-artifact@v4
        with:
          pattern: blob-report-*
          path: all-blob-reports
          merge-multiple: true
      - if: needs.e2e.result == 'success' || needs.e2e.result == 'failure'
        run: pnpm exec playwright merge-reports --reporter html ./all-blob-reports
      - if: needs.e2e.result == 'success' || needs.e2e.result == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7
      - name: Both shards passed
        if: always()
        env:
          CHANGES: ${{ needs.changes.result }}
          SHARDS: ${{ needs.e2e.result }}
        run: |
          echo "changes: $CHANGES, shards: $SHARDS"
          if [ "$CHANGES" != "success" ]; then
            echo "::error::The changes job did not succeed, so nothing was tested."; exit 1
          fi
          if [ "$SHARDS" != "success" ] && [ "$SHARDS" != "skipped" ]; then
            echo "::error::A Playwright shard did not pass ($SHARDS). The merged report is the playwright-report artifact."; exit 1
          fi
