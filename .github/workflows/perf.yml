# Perf probe (unit P, 2026-10-15; ARCHITECTURE §19 "Measuring the Worker"). By hand only:
# Actions → Perf probe → Run workflow → pick the branch. It times what the Worker answers, route
# by route, from a GitHub runner, against this branch's preview (uploaded by preview.yml on the
# last push) and, for the comparison, against staging (what `main` last deployed). The table lands
# in the job summary; `scripts/perf-probe.mjs` says what each column means.
#
# It signs in as a **staging** member (the first active member of the chosen role) through a
# magic link the service key mints and nobody is sent, with the same cookie writer the app uses.
# Staging only, by construction: the Supabase project and the keys are the `staging` GitHub
# environment's, and the script refuses a production address. No migration, no deploy, nothing
# written: the probe reads screens.
#
# Where the runner sits matters (the US): every Worker → Supabase (Mumbai) round trip costs
# ~200 ms from there, so the numbers show a waterfall clearly and say nothing about the owner's
# absolute times. The `colo` column names the Cloudflare location that ran the Worker.
name: Perf probe

on:
  workflow_dispatch:
    inputs:
      samples:
        description: "Samples per route and connection kind"
        type: string
        default: "5"
      role:
        description: "Sign in as the first active member of this role (staging)"
        type: choice
        default: owner
        options:
          - owner
          - admin
          - staff
      compare:
        description: "Also probe staging (what main last deployed) for a before/after"
        type: boolean
        default: true
      base_url:
        description: "Probe this address instead of the branch preview (a preview or staging URL)"
        type: string
        default: ""

permissions:
  contents: read

jobs:
  probe:
    name: probe
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: staging
    steps:
      - uses: actions/checkout@v4

      # The same alias rule as preview.yml, so the branch's preview address is predicted here.
      - name: Work out the preview address
        id: names
        env:
          STAGING_URL: ${{ vars.NEXT_PUBLIC_APP_URL }}
          BASE_URL: ${{ inputs.base_url }}
        run: |
          set -euo pipefail
          if [ -z "${STAGING_URL:-}" ]; then
            echo "::error::NEXT_PUBLIC_APP_URL is not set in the staging GitHub environment."
            exit 1
          fi
          host="${STAGING_URL#*://}"; host="${host%%/*}"
          worker="${host%%.*}"
          subdomain="${host#*.}"
          branch="$GITHUB_REF_NAME"
          alias="$(printf '%s' "$branch" | tr -c 'a-zA-Z0-9-' '-' | tr -s '-' | sed 's/^-*//; s/-*$//' | tr 'A-Z' 'a-z')"
          case "$alias" in [a-z]*) ;; *) alias="b-$alias" ;; esac
          max=$(( 63 - ${#worker} - 1 ))
          if [ "${#alias}" -gt "$max" ]; then
            suffix="$(printf '%s' "$branch" | sha1sum | cut -c1-6)"
            alias="$(printf '%s' "$alias" | cut -c1-"$(( max - 7 ))" | sed 's/-*$//')-$suffix"
          fi
          if [ -n "${BASE_URL:-}" ]; then
            target="${BASE_URL%/}"
          elif [ "$branch" = "main" ]; then
            target="$STAGING_URL"
          else
            target="https://${alias}-${worker}.${subdomain}"
          fi
          {
            echo "target=$target"
            echo "staging_url=$STAGING_URL"
            echo "label=$branch @ ${GITHUB_SHA:0:8}"
          } >>"$GITHUB_OUTPUT"
          echo "target=$target"

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Probe the branch preview
        env:
          SUPABASE_URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ vars.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          TARGET: ${{ steps.names.outputs.target }}
          LABEL: ${{ steps.names.outputs.label }}
          SAMPLES: ${{ inputs.samples }}
          ROLE: ${{ inputs.role }}
        run: |
          set -euo pipefail
          node scripts/perf-probe.mjs --base "$TARGET" --samples "$SAMPLES" --role "$ROLE" \
            --label "$LABEL" --out "$RUNNER_TEMP/probe-branch.json"

      - name: Probe staging (main) for the comparison
        if: inputs.compare && steps.names.outputs.target != steps.names.outputs.staging_url
        env:
          SUPABASE_URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ vars.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          TARGET: ${{ steps.names.outputs.staging_url }}
          SAMPLES: ${{ inputs.samples }}
          ROLE: ${{ inputs.role }}
        run: |
          set -euo pipefail
          node scripts/perf-probe.mjs --base "$TARGET" --samples "$SAMPLES" --role "$ROLE" \
            --label "staging (main)" --out "$RUNNER_TEMP/probe-staging.json"

      - name: Keep the raw numbers
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: perf-probe-${{ github.run_id }}
          path: ${{ runner.temp }}/probe-*.json
          if-no-files-found: ignore
          retention-days: 14
