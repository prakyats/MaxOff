# Build scripts pnpm may run on install (pnpm 12 blocks them by default).
# esbuild + workerd: `wrangler` / OpenNext local preview. @sentry/cli: source-map upload at deploy.
allowBuilds:
  "@sentry/cli": true
  esbuild: true
  sharp: false
  unrs-resolver: false
  workerd: true
# OpenNext writes linked source maps for its two bundles and copies Next's server maps next to the
# chunks it bundles, so the Worker's map leads back to src/ (ROADMAP 6.6, ARCHITECTURE §18.2).
# Re-make the patch (`pnpm patch @opennextjs/cloudflare`) when OpenNext is upgraded: pnpm refuses
# to install while a patch names a version that is not installed.
patchedDependencies:
  "@opennextjs/cloudflare@1.20.6": patches/@opennextjs__cloudflare@1.20.6.patch
  # A refresh whose answer mismatches the router tree (after a view control's hand-written
  # address) must not scroll the page to its top (v1.9, issue #89; ARCHITECTURE §14.2 d). The
  # patch file's header has the upstream issue to file and how to check it on every Next upgrade.
  next@16.3.5: patches/next@16.3.5.patch
